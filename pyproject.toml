[project]
name = "editarr"
version = "0.1.20"
description = "Media scanning and classification pipeline for flagging objectionable content"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.16.0,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
    "nudenet>=3.4.2",
    "onnxruntime>=1.19.0",
    "torch>=2.3.0 ; sys_platform != 'linux'",
    "torch>=2.7.0,<2.10 ; sys_platform == 'linux'",
    "torchvision>=0.22.0,<0.25 ; sys_platform == 'linux'",
    "transformers>=4.49.0",
    "timm>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "faster-whisper>=1.0.0",
    "better-profanity>=0.7.0",
    "glin-profanity",
    "imageio-ffmpeg>=0.5.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "scenedetect>=0.7.1",
    "opencv-python-headless>=4.10.0",
    "av>=12.0.0",
    "alt-profanity-check>=1.9.0",
    "mlx-vlm>=0.3.4 ; sys_platform == 'darwin'",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pyinstaller>=6.17.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
]
audio_macos = [
    "mlx-whisper>=0.4.0",
]

[project.scripts]
editarr = "scanner.cli:main"
editarr-replay-qwen = "scanner.commands.qwen_replay_cli:main"
editarr-evaluate-video-model = "scanner.commands.video_model_eval_cli:main"
editarr-evaluate-subcategorization = "scanner.commands.subcategorization_eval_cli:main"
editarr-add-video-model-corpus-range = "scanner.commands.video_model_corpus_cli:main"
editarr-evaluate-credits = "scanner.commands.credits_eval_cli:main"
editarr-evaluate-folder = "scanner.commands.folder_eval_cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/scanner",
    "/scripts/hatch_build.py",
    "/scripts/release_assets.py",
    "/web/package.json",
]

[tool.hatch.build]
exclude = [
    "/scanner/.DS_Store",
    "/scanner/__pycache__",
    "/scanner/batch_*.py",
]

[tool.uv]
# Require wheels for the Linux package target even when locking on macOS.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# scenedetect and mlx-vlm request the GUI OpenCV build; the headless build already
# provides the same `cv2` module, so never install both into one package directory.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
markers = [
    "real_migrations: run packaged migrations instead of copying the test template database",
]

[tool.coverage.run]
source = ["scanner"]

[tool.coverage.report]
fail_under = 60
show_missing = true
