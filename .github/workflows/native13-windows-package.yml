name: Windows x64 installer

on:
  workflow_call:
    inputs:
      revision:
        description: Source revision selected by the release planner
        required: true
        type: string
      version:
        description: Version selected by the release planner
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 runtime and installer
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      RELEASE_REVISION: ${{ inputs.revision }}
      RELEASE_VERSION: ${{ inputs.version }}
      EDITARR_BUILD_JOBS: '4'
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'

      - name: Install pinned Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: native_build/backup_age/go.sum

      - name: Install Node and locked pnpm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          if ($LASTEXITCODE -ne 0) { throw "pnpm setup failed with exit code $LASTEXITCODE" }

      - name: Install pinned uv
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          if ($LASTEXITCODE -ne 0) { throw "uv installation failed with exit code $LASTEXITCODE" }

      - name: Prepare source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = $env:GITHUB_WORKSPACE
          if ($env:RELEASE_VERSION) {
            git config core.autocrlf false
            git config core.longpaths true
            $source = Join-Path $env:RUNNER_TEMP 'release-source'
            git worktree add --detach $source $env:RELEASE_REVISION
            python -m scripts.prepare_main_release prepare $source $env:RELEASE_REVISION $env:RELEASE_VERSION
          }
          "EDITARR_WINDOWS_SOURCE=$source" >> $env:GITHUB_ENV

      - name: Prepare pinned media source and managed Python
        if: inputs.version != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location -LiteralPath $env:EDITARR_WINDOWS_SOURCE
          $bootstrap = Join-Path $env:RUNNER_TEMP 'windows-bootstrap'
          $media = Join-Path $env:RUNNER_TEMP 'windows-media'
          python -m scripts.prepare_alpha_distribution prepare windows-x64 $bootstrap
          uv sync --locked --managed-python --python 3.11.16 --extra dev
          "EDITARR_WINDOWS_BOOTSTRAP=$bootstrap" >> $env:GITHUB_ENV
          "EDITARR_WINDOWS_MEDIA=$media" >> $env:GITHUB_ENV

      - name: Install MSYS2 media build tools
        if: inputs.version != ''
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Identify MSYS2 release build tools
        if: inputs.version != ''
        id: mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          packages=$(pacman -Q | awk '$1 == "make" || $1 ~ /^mingw-w64-ucrt-x86_64-(gcc|binutils|headers|crt|nasm|pkgconf)/')
          digest=$(printf '%s\n' "$(gcc -dumpfullversion)" "$packages" | sha256sum | cut -d ' ' -f 1)
          printf 'digest=%s\n' "$digest" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Install pinned FFprobe for manual evidence builds
        if: inputs.version == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=9.0.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed with exit code $LASTEXITCODE" }

      - name: Enter the native MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 tools are unavailable' }
          $devShell = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 is unavailable' }
          $toolPath = Split-Path -Parent $iscc
          "PATH=$env:PATH;$toolPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBPATH=$env:LIBPATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSCMD_ARG_TGT_ARCH=amd64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Command cl.exe
          Get-Command rc.exe
          Get-Item -LiteralPath $iscc

      - name: Identify the Windows media build inputs
        if: inputs.version != ''
        id: media-inputs
        env:
          MINGW_TOOLCHAIN: ${{ steps.mingw.outputs.digest }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location -LiteralPath $env:EDITARR_WINDOWS_SOURCE
          $paths = @(
            "${env:RELEASE_REVISION}:uv.lock"
            'HEAD:native_build/windows/build_media.sh'
            'HEAD:native_build/windows/build_media_wheels.ps1'
            'HEAD:native_build/windows/opencv-no-windows-ffmpeg.patch'
            'HEAD:native_build/windows/verify_media_cache.ps1'
            'HEAD:scripts/prepare_alpha_distribution.py'
          )
          $blobs = @(git rev-parse $paths)
          $compiler = (Get-Item -LiteralPath (Get-Command cl.exe).Source).VersionInfo.FileVersion
          $sdk = (Get-Item -LiteralPath (Get-Command rc.exe).Source).VersionInfo.FileVersion
          $identity = @($env:MINGW_TOOLCHAIN, $compiler, $sdk, $env:ImageVersion, '3.11.16', $env:EDITARR_BUILD_JOBS) + $blobs
          $data = [Text.Encoding]::UTF8.GetBytes($identity -join '|')
          $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($data)).ToLowerInvariant()
          "key=editarr-media-windows-x64-$digest" >> $env:GITHUB_OUTPUT

      - name: Restore source-built Windows media
        if: inputs.version != ''
        id: media-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}\windows-media\standalone\bin\ffmpeg.exe
            ${{ runner.temp }}\windows-media\standalone\bin\ffprobe.exe
            ${{ runner.temp }}\windows-media\wheels
            ${{ runner.temp }}\windows-media\SHA256SUMS.json
          key: ${{ steps.media-inputs.outputs.key }}

      - name: Verify the restored Windows media
        if: inputs.version != '' && steps.media-cache.outputs.cache-hit == 'true'
        id: restored-media
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & (Join-Path $env:EDITARR_WINDOWS_SOURCE 'native_build\windows\verify_media_cache.ps1') -Media $env:EDITARR_WINDOWS_MEDIA
            'valid=true' >> $env:GITHUB_OUTPUT
          } catch {
            Write-Warning "The restored media cache is incomplete. Rebuilding from source. $_"
            Remove-Item -LiteralPath $env:EDITARR_WINDOWS_MEDIA -Recurse -Force
          }

      - name: Compile FFmpeg and its encoders from release sources
        if: inputs.version != '' && steps.restored-media.outputs.valid != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source_path=$(cygpath -u "$EDITARR_WINDOWS_SOURCE")
          bash "$source_path/native_build/windows/build_media.sh" "$EDITARR_WINDOWS_BOOTSTRAP/sources" "$EDITARR_WINDOWS_MEDIA"

      - name: Build PyAV and OpenCV from release sources
        if: inputs.version != '' && steps.restored-media.outputs.valid != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location -LiteralPath $env:EDITARR_WINDOWS_SOURCE
          & (Join-Path $env:EDITARR_WINDOWS_SOURCE 'native_build\windows\build_media_wheels.ps1') -Sources (Join-Path $env:EDITARR_WINDOWS_BOOTSTRAP 'sources') -Media $env:EDITARR_WINDOWS_MEDIA
          & (Join-Path $env:EDITARR_WINDOWS_SOURCE 'native_build\windows\verify_media_cache.ps1') -Media $env:EDITARR_WINDOWS_MEDIA -Record

      - name: Install and validate source-built Windows media
        if: inputs.version != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location -LiteralPath $env:EDITARR_WINDOWS_SOURCE
          foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
            & (Join-Path $env:EDITARR_WINDOWS_MEDIA "standalone\bin\$tool") -version
          }
          $wheels = @(Get-ChildItem -LiteralPath (Join-Path $env:EDITARR_WINDOWS_MEDIA 'wheels') -Filter '*.whl' -File)
          uv pip uninstall opencv-python opencv-python-headless
          uv pip install --no-deps --reinstall $wheels.FullName
          uv run --no-sync python -c "import av; from cv2.dnn import blobFromImage; print(av.library_versions)"
          uv run --no-sync python -m scripts.prepare_alpha_distribution collect-notices $env:EDITARR_WINDOWS_BOOTSTRAP
          'UV_NO_SYNC=1' >> $env:GITHUB_ENV

      - name: Cache validated Windows media for later builds
        if: inputs.version != '' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}\windows-media\standalone\bin\ffmpeg.exe
            ${{ runner.temp }}\windows-media\standalone\bin\ffprobe.exe
            ${{ runner.temp }}\windows-media\wheels
            ${{ runner.temp }}\windows-media\SHA256SUMS.json
          key: ${{ steps.media-inputs.outputs.key }}

      - name: Build and verify the native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:EDITARR_WINDOWS_SOURCE
          function Invoke-Native13 {
            param(
              [Parameter(Mandatory = $true)][string]$Description,
              [Parameter(Mandatory = $true)][scriptblock]$Command
            )
            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "$Description failed with exit code $LASTEXITCODE"
            }
          }

          $hostLocalAppData = [Environment]::GetFolderPath('LocalApplicationData')
          $hostEditarr = Join-Path $hostLocalAppData 'Editarr'
          if (Test-Path -LiteralPath $hostEditarr) {
            throw "Refusing to use existing native Editarr path: $hostEditarr"
          }

          $taskRoot = Join-Path $env:RUNNER_TEMP ('editarr-native13-' + [guid]::NewGuid())
          $taskHomeDir = Join-Path $taskRoot 'home'
          $taskTempDir = Join-Path $taskRoot 'tmp'
          $taskCacheDir = Join-Path $taskRoot 'cache'
          $taskUvCacheDir = Join-Path $taskRoot 'uv-cache'
          $taskLocalAppDataDir = Join-Path $taskRoot 'localappdata'
          $runtimeOutput = Join-Path $taskRoot 'raw output'
          $evidenceOutput = Join-Path $env:RUNNER_TEMP 'native13-raw-verifier.json'
          New-Item -ItemType Directory -Force $taskRoot, $taskHomeDir, $taskTempDir, $taskCacheDir, $taskUvCacheDir, $taskLocalAppDataDir |
            Out-Null
          $env:HOME = $taskHomeDir
          $env:USERPROFILE = $taskHomeDir
          $env:TEMP = $taskTempDir
          $env:TMP = $taskTempDir
          $env:XDG_CACHE_HOME = $taskCacheDir
          $env:UV_CACHE_DIR = $taskUvCacheDir
          $env:LOCALAPPDATA = $taskLocalAppDataDir
          $env:COREPACK_HOME = Join-Path $taskRoot 'corepack'
          $env:EDITARR_NATIVE13_TASK_ROOT = $taskRoot
          $env:EDITARR_NATIVE13_RUNTIME = Join-Path $runtimeOutput 'Editarr'

          Invoke-Native13 'prepare locked pnpm in isolated HOME' {
            corepack prepare pnpm@11.22.0 --activate
          }
          Invoke-Native13 'python --version' { python --version }
          Invoke-Native13 'uv --version' { uv --version }
          Invoke-Native13 'pnpm --version' { pnpm --version }
          if (-not $env:RELEASE_VERSION) {
            Invoke-Native13 'uv sync' { uv sync --locked --python 3.11.9 --extra dev }
          }
          Invoke-Native13 'ruff' {
            uv run ruff check native_build scanner/settings/capabilities.py scanner/models.py scanner/pipeline/audio.py scripts/build_release.py scripts/package_windows.py scripts/verify_installed_release.py tests/test_model_capabilities.py tests/test_audio_progress.py tests/test_native_runtime_build.py tests/test_native_artifact_size.py tests/test_native_collection_size.py tests/test_installed_artifact_verifier.py tests/test_windows_package.py
          }
          Invoke-Native13 'focused pytest' {
            uv run pytest -q -n 0 tests/test_model_capabilities.py tests/test_audio_progress.py tests/test_native_runtime_build.py tests/test_native_artifact_size.py tests/test_native_collection_size.py tests/test_installed_artifact_verifier.py tests/test_windows_package.py --junitxml "$env:RUNNER_TEMP\native13-windows-junit.xml"
          }

          $mediaOptions = @()
          if ($env:RELEASE_VERSION) {
            $ffprobeRoot = Join-Path $env:EDITARR_WINDOWS_MEDIA 'standalone\bin'
            $mediaOptions = @('--source-media-release', '--ffmpeg-helper', (Join-Path $ffprobeRoot 'ffmpeg.exe'))
          } else {
            $ffprobeRoot = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          }
          $ffprobeCandidates = @(Get-ChildItem -LiteralPath $ffprobeRoot -Filter 'ffprobe.exe' -File -Recurse)
          if ($ffprobeCandidates.Count -ne 1) {
            throw "Expected one real target-native ffprobe.exe below $ffprobeRoot, found $($ffprobeCandidates.Count)"
          }
          $ffprobe = $ffprobeCandidates[0]
          $ffprobeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $ffprobe.FullName).Hash.ToLowerInvariant()
          Invoke-Native13 'target-native ffprobe version' { & $ffprobe.FullName -version }
          Invoke-Native13 'native PyInstaller build' {
            uv run python -m scripts.build_release --target windows-x64 --out-dir $runtimeOutput --work-dir $taskTempDir --ffprobe-helper $ffprobe.FullName @mediaOptions
          }

          $runtime = $env:EDITARR_NATIVE13_RUNTIME
          if (Test-Path -LiteralPath (Join-Path $runtime '_internal\native-test-fake-models.marker')) {
            throw 'A distributable runtime must not include the fake model marker'
          }
          $forbidden = Get-ChildItem -LiteralPath $runtime -Recurse -Force | Where-Object {
            $relative = [IO.Path]::GetRelativePath($runtime, $_.FullName)
            $mlxPackage = -not $_.PSIsContainer -and $relative -match '(?i)^_internal[\\/]mlx([_-][^\\/]*)?([\\/]|$)'
            $acceleratorBinary = -not $_.PSIsContainer -and $_.Name -match '(?i)\.(dll|pyd|so|dylib)$' -and $relative -match '(?i)mlx|cuda|cudnn|cublas|cudart|nvrtc|nvjitlink|nvidia'
            $allowedCTranslate2Cuda = -not $_.PSIsContainer -and $relative -match '(?i)^_internal[\\/]ctranslate2[\\/](cudnn|cublas|cudart|nvrtc|nvjitlink)[^\\/]*\.dll$'
            $_.Name -match '(?i)^(python|node|pnpm)\.exe$' -or
            $mlxPackage -or
            ($acceleratorBinary -and -not $allowedCTranslate2Cuda) -or
            $relative -match '(?i)^(data|credentials|corpora)([\\/]|$)'
          }
          if ($forbidden) {
            $names = ($forbidden | Select-Object -First 20 -ExpandProperty FullName) -join ', '
            throw "Forbidden runtime payload detected: $names"
          }
          Invoke-Native13 'raw NATIVE-11 verifier' {
            uv run python -m scripts.verify_installed_release --runtime $runtime --target windows-x64 --json-out $evidenceOutput
          }
          Invoke-Native13 'git diff --check' { git diff --check }

          $inventory = Get-Content -LiteralPath (Join-Path $runtime 'editarr-runtime-inventory.json') -Raw | ConvertFrom-Json
          if ($env:RELEASE_VERSION) {
            $releaseCommit = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot determine the prepared release commit' }
            if ($inventory.version -ne $env:RELEASE_VERSION -or
                $inventory.source_revision -ne $releaseCommit -or
                $inventory.source_dirty -ne $false -or $inventory.target -ne 'windows-x64') {
              throw 'Windows runtime inventory does not match the prepared release'
            }
          }
          $entrypoint = Get-Item -LiteralPath (Join-Path $runtime 'Editarr.exe')
          $entrypointHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $entrypoint.FullName).Hash.ToLowerInvariant()
          Write-Host "NATIVE13_RUNTIME_TARGET=$($inventory.target)"
          Write-Host "NATIVE13_RUNTIME_VERSION=$($inventory.version)"
          Write-Host "NATIVE13_RUNTIME_SOURCE=$($inventory.source_revision)"
          Write-Host "NATIVE13_RUNTIME_ENTRYPOINT_SHA256=$entrypointHash"
          Write-Host "NATIVE13_RUNTIME_SIZE_BYTES=$($inventory.runtime_size_bytes)"
          Write-Host "NATIVE13_FFPROBE=$($ffprobe.FullName)"
          Write-Host "NATIVE13_FFPROBE_SHA256=$ffprobeHash"

          "EDITARR_NATIVE13_TASK_ROOT=$taskRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDITARR_NATIVE13_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package and exercise the unsigned per-user installer
        shell: pwsh
        run: |
          & (Join-Path $env:EDITARR_WINDOWS_SOURCE "native_build\windows\package_and_verify.ps1")

      - name: Upload Windows release installer
        if: inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: editarr-v${{ inputs.version }}-windows
          path: ${{ runner.temp }}\windows-release-assets\
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 3

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native13-windows-x64-evidence-${{ inputs.version || github.run_id }}
          path: |
            ${{ runner.temp }}\native13-windows-junit.xml
            ${{ runner.temp }}\native13-raw-verifier.json
            ${{ runner.temp }}\native13-installed-verifier.json
            ${{ runner.temp }}\native13-inno-install.log
            ${{ runner.temp }}\native13-inno-uninstall.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
