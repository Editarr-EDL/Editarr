name: NATIVE-05 Windows x64 lifecycle evidence

on:
  # This exact temporary branch lets the approved native-host validation run
  # before the workflow reaches the default branch (where manual dispatch is
  # available in the Actions UI).
  push:
    branches:
      - codex/native05-windows-evidence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native05-windows-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Windows x64 source lifecycle tests
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'

      - name: Install pinned uv
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          if ($LASTEXITCODE -ne 0) {
            throw "uv installation failed with exit code $LASTEXITCODE"
          }

      - name: Run isolated Windows lifecycle evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-TaskNativeCommand {
            param(
              [Parameter(Mandatory = $true)][string]$Description,
              [Parameter(Mandatory = $true)][scriptblock]$Command
            )
            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "$Description failed with exit code $LASTEXITCODE"
            }
          }
          $hostLocalAppData = [Environment]::GetFolderPath('LocalApplicationData')
          $hostEditarr = Join-Path $hostLocalAppData 'Editarr'
          if (Test-Path -LiteralPath $hostEditarr) {
            throw "Refusing to use existing native Editarr path: $hostEditarr"
          }

          $taskRoot = Join-Path $env:RUNNER_TEMP ('editarr-native05-' + [guid]::NewGuid())
          $taskHomeDir = Join-Path $taskRoot 'home'
          $taskTempDir = Join-Path $taskRoot 'tmp'
          $taskCacheDir = Join-Path $taskRoot 'cache'
          $taskUvCacheDir = Join-Path $taskRoot 'uv-cache'
          $taskLocalAppDataDir = Join-Path $taskRoot 'localappdata'
          New-Item -ItemType Directory -Force $taskRoot, $taskHomeDir, $taskTempDir, $taskCacheDir, $taskUvCacheDir, $taskLocalAppDataDir |
            Out-Null
          $env:HOME = $taskHomeDir
          $env:USERPROFILE = $taskHomeDir
          $env:TEMP = $taskTempDir
          $env:TMP = $taskTempDir
          $env:XDG_CACHE_HOME = $taskCacheDir
          $env:UV_CACHE_DIR = $taskUvCacheDir
          $env:LOCALAPPDATA = $taskLocalAppDataDir

          Invoke-TaskNativeCommand 'python --version' { python --version }
          Invoke-TaskNativeCommand 'uv --version' { uv --version }
          Invoke-TaskNativeCommand 'uv sync' { uv sync --locked --extra dev }
          Invoke-TaskNativeCommand 'ruff' {
            uv run ruff check scanner/security/auth_crypto.py scanner/runtime/process_control.py scanner/runtime/process_control_windows.py scanner/api.py scanner/runtime/restart_service.py scanner/pipeline/runner.py tests/test_auth_crypto.py tests/test_process_control_units.py tests/test_process_control_integration.py tests/test_processes.py tests/test_restart_controller.py tests/test_restart_integration.py tests/test_queue_scheduler.py tests/test_queue_workers.py tests/test_queue_credits.py tests/test_frozen_bootstrap.py tests/test_scan_pause_checkpoints.py tests/test_scan_pause_restart.py
          }
          Invoke-TaskNativeCommand 'pytest' {
            uv run pytest -q -n 0 tests/test_auth_crypto.py tests/test_process_control_units.py tests/test_process_control_integration.py tests/test_processes.py tests/test_restart_controller.py tests/test_restart_integration.py tests/test_queue_scheduler.py tests/test_queue_workers.py tests/test_queue_credits.py tests/test_frozen_bootstrap.py tests/test_scan_pause_checkpoints.py tests/test_scan_pause_restart.py --junitxml "$env:RUNNER_TEMP\native05-windows-junit.xml"
          }
          Invoke-TaskNativeCommand 'git diff --check' { git diff --check }

          if (Test-Path -LiteralPath $hostEditarr) {
            throw "Native Editarr path was created unexpectedly: $hostEditarr"
          }

      - name: Upload JUnit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native05-windows-x64-junit-${{ github.run_id }}
          path: ${{ runner.temp }}\native05-windows-junit.xml
          if-no-files-found: warn
          retention-days: 14
