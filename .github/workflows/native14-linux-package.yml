name: Linux x86_64 AppImage

on:
  push:
    branches:
      - codex/native14-linux-package
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Rocky 8 baseline build and Ubuntu package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ROCKY_IMAGE: rockylinux/rockylinux@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.REVISION }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false

      - name: Prepare version and pinned source inputs
        id: release-inputs
        shell: bash
        run: |
          cache_hash=$(
            {
              printf '%s\n' "$ROCKY_IMAGE"
              git rev-parse "$REVISION:uv.lock" "$REVISION:scripts/prepare_alpha_distribution.py" \
                "$REVISION:native_build/linux/build_media.sh" \
                "$REVISION:native_build/linux/prepare_appimage_sources.sh" \
                "$REVISION:native_build/linux/build_package_ci.sh" \
                "$REVISION:native_build/linux/media_cache.sh"
            } | sha256sum | cut -d ' ' -f1
          )
          printf 'cache-hash=%s\n' "$cache_hash" >> "$GITHUB_OUTPUT"
          if [[ -n "$VERSION" ]]; then
            python3 -m scripts.prepare_main_release prepare "$GITHUB_WORKSPACE" "$REVISION" "$VERSION"
          fi
          task_root="$RUNNER_TEMP/editarr-native14"
          mkdir "$task_root"
          python3 -m scripts.prepare_alpha_distribution prepare linux-x86_64 "$task_root/bootstrap"
          bash native_build/linux/prepare_appimage_sources.sh "$task_root/bootstrap"

      - name: Restore built media
        id: media-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/editarr-native14/media/prefix
            ${{ runner.temp }}/editarr-native14/media/wheels
            ${{ runner.temp }}/editarr-native14/media/helpers
            ${{ runner.temp }}/editarr-native14/media/SHA256SUMS.txt
          key: editarr-linux-media-${{ runner.arch }}-${{ steps.release-inputs.outputs.cache-hash }}

      - name: Build and verify on the glibc 2.28 baseline
        shell: bash
        run: |
          task_root="$RUNNER_TEMP/editarr-native14"
          node_root=$(dirname "$(dirname "$(command -v node)")")
          go_root=$(go env GOROOT)
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$task_root:/native14" \
            -v "$node_root:/tools/node:ro" \
            -v "$go_root:/tools/go:ro" \
            -e VERSION \
            -w /workspace \
            "$ROCKY_IMAGE" \
            env PATH=/tools/node/bin:/tools/go/bin:/usr/local/bin:/usr/bin:/usr/sbin:/bin \
              bash native_build/linux/build_package_ci.sh /native14

      - name: Return build outputs to the runner user
        id: build-outputs
        if: always()
        shell: bash
        run: |
          task_root="$RUNNER_TEMP/editarr-native14"
          if [[ -d "$task_root" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$task_root"
            if bash native_build/linux/media_cache.sh verify "$task_root/media"; then
              echo 'verified-media=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save verified media
        if: ${{ !cancelled() && steps.media-cache.outputs.cache-hit != 'true' && steps.build-outputs.outputs.verified-media == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/editarr-native14/media/prefix
            ${{ runner.temp }}/editarr-native14/media/wheels
            ${{ runner.temp }}/editarr-native14/media/helpers
            ${{ runner.temp }}/editarr-native14/media/SHA256SUMS.txt
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Verify AppImage on newer Ubuntu with FUSE and extraction fallback
        shell: bash
        run: bash native_build/linux/verify_package_ci.sh "$RUNNER_TEMP/editarr-native14"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86-64-evidence-${{ inputs.version || github.run_id }}
          path: |
            ${{ runner.temp }}/editarr-native14/native14-*.json
            ${{ runner.temp }}/editarr-native14/native14-*.txt
            ${{ runner.temp }}/editarr-native14/native14-linux-junit.xml
            ${{ runner.temp }}/editarr-native14/package output/editarr-linux-package.json
            ${{ runner.temp }}/editarr-native14/package output/*.sha256
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Upload verified release AppImage and source archives
        if: inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: editarr-v${{ inputs.version }}-linux
          path: ${{ runner.temp }}/editarr-native14/release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Retain the development AppImage for acceptance reproduction
        if: inputs.version == ''
        uses: actions/upload-artifact@v7
        with:
          name: native14-development-appimage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/editarr-native14/package output/*.AppImage
            ${{ runner.temp }}/editarr-native14/package output/*.sha256
            ${{ runner.temp }}/editarr-native14/package output/editarr-linux-package.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          overwrite: true
